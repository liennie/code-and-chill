server:
  # host:
  port: 8080
  # tlsCertFile: /etc/letsencrypt/live/host/fullchain.pem
  # tlsKeyFile: /etc/letsencrypt/live/host/privkey.pem
  # tlsReloadSchedule: "0 0 * * *"
  # httpsRedirect: true
  dataDir: data
  shutdownTimeout: 30s

db:
  file: db/cc.db
  backupSchedule: "0 0/4 * * *"
  backupDir: bak
  backupNum: 84

session:
  bits: 256
  expire: 720h # 30 days
  truncate: 24h
  cleanupSchedule: "0 5 * * *"

auth:
  discord:
    clientID: "1423632113676062852"
    clientSecret: secret/discord.clientsecret.txt
    redirectURI: http://localhost:8080/auth/discord
    exchangeTimeout: 10s

notifier:
  baseURI: http://localhost:8080/
  discord:
    token: secret/discord.token.txt
    channels:
      test:
        notifications: "1472419290568331458"
        forum: "1472400581229547621"

puzzles:
  name: "Code && Chill"
  default: "test"
  events:
    - path: test
      config: ../cc-test/event.yaml
