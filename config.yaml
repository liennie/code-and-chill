server:
  # host:
  port: 8080
  # tlsCertFile: /etc/letsencrypt/live/host/fullchain.pem
  # tlsKeyFile: /etc/letsencrypt/live/host/privkey.pem
  # tlsReloadInterval: 24h
  # httpsRedirect: true
  dataDir: data
  shutdownTimeout: 30s

db:
  file: db/cc.db
  backupSchedule: "0 0/4 * * *"
  backupDir: bak
  backupNum: 24

session:
  bits: 256
  expire: 720h # 30 days
  truncate: 24h
  cleanupSchedule: "0 5 * * *"

auth:
  discord:
    clientID: "1423632113676062852"
    clientSecret: secret/discord.txt
    redirectURI: http://localhost:8080/auth/discord
    exchangeTimeout: 10s

puzzles:
  name: "Code && Chill"
  default: "test"
  events:
    - path: test
      config: ../cc-test/event.yaml
