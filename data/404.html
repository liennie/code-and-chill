<!doctype html>
<html lang="en" class="dark">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>404 Not Found</title>
	<link rel="stylesheet" href="/style.css">
	<script src="script.js" defer async></script>
	<style>
		/* small page-specific tweaks */
		.error-404 {
			display: flex;
			align-items: center;
			justify-content: center;
			height: calc(100vh - 4rem);
			text-align: center;
			gap: 1rem;
			flex-direction: column;
		}

		.error-404 h1 {
			font-size: 3rem;
			margin: 0;
		}

		.error-404 p {
			margin: 0.5rem 0 1rem 0;
		}

		.btn-home {
			display: inline-block;
			padding: 0.6rem 1rem;
			border: 1px solid currentColor;
			background: var(--bg-btn);
			text-decoration: none;
			color: inherit;
		}
	</style>
</head>

<body class="page">
	<header class="topbar">
		<div class="brand"><a class="brand-link" href="/">woc</a></div>
		<nav class="topnav" aria-label="Main navigation">
			<a href="/">Home</a>
		</nav>
	</header>

	<main class="content center" role="main">
		<article aria-labelledby="error-title">
			<div class="error-404">
				<h1 id="error-title">404 — Page not found</h1>
				<p>We couldn't find the page you were looking for.</p>
				<p><a class="btn-home" href="/">Return to the homepage</a></p>
				<p class="meta" style="color:var(--color-inactive);font-size:0.9rem">If you followed a link, it may be out of date — try the homepage or the sitemap.</p>
			</div>
		</article>
	</main>

</body>

</html>
