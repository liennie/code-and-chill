<h1 id="log-in">Log in</h1>

{{ $return := $.Request.URL.Query.Get "return" | trimPrefix "/" -}}
<p>Please <a href="/{{ $.Event.Path }}/login/discord{{ if $return }}?return={{ $return }}{{ end }}"><i class="discord-icon"></i>log in using your Discord account</a> to participate in <em>Code && Chill::</em><a href="/{{ $.Event.Path }}">{{ $.Event.Name }}</a>.</p>

<p>Logging in allows us to:</p>
<ul>
	<li>Track your progress and submissions</li>
	<li>Display your name on the <a href="/{{ $.Event.Path }}/leaderboard">leaderboard</a></li>
</ul>
