{{ if .LB.Second }}
<div class="slide-place">
	<h1 style="--name-len: {{ add (len .LB.Second.Name) 3 }}">🥈 {{ .LB.Second.Name }}</h1>
	<div class="stats">
		<div class="stat">
			<div class="value">{{ .LB.Second.Parts }}</div>
			<div class="label"><span class="secondary-color">Parts solved</span></div>
		</div>
		<div class="stat">
			<div class="value">{{ .LB.Second.Score }}</div>
			<div class="label"><span class="secondary-color">Score</span></div>
		</div>
	</div>
</div>
{{ end }}
