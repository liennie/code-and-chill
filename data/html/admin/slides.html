<h1 id="slides"><a href="/{{ $.Event.Path }}/admin">Admin</a>::Presentation</h1>

<ul class="deck-list">
	{{- range .Admin.SlideDecks }}
	<li>
		<a href="/{{ $.Event.Path }}/admin/slides/{{ . }}">
			<span class="deck-thumb"><iframe src="/{{ $.Event.Path }}/admin/slides/{{ . }}" tabindex="-1" loading="lazy"></iframe></span>
			<span class="deck-name">{{ . }}</span>
		</a>
	</li>
	{{- end }}
</ul>
